version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: backend
    container_name: backend
    expose:
      - "6000"
    restart: unless-stopped
    networks:
      - webnet

  reverse-proxy:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    image: reverse-proxy
    container_name: reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/infrahub.me:/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
